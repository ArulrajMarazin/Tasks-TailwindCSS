<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d34b88e3f6.js" crossorigin="anonymous"></script>

</head>

<body class="bg-blue-800 flex justify-center items-center h-screen">

    <div class="bg-white rounded-lg p-4 ">

        <h1 class="text-3xl font-medium text-center mb-2.5 border-b-1 border-gray-200 pb-2.5 "><i
                class="fa-solid fa-user"></i> Login</h1>

        <form class="flex flex-col gap-1" action="#">

            <label class="" for="username">Username</label>
            <input class="outline-1 outline-gray-200 p-1 w-82 mb-2.5" type="text" placeholder="Enter Username..."
                required>

            <label class="" for="password">Password</label>
            <input class="outline-1 outline-gray-200 p-1 w-82 mb-2.5" type="password" placeholder="Enter Password..."
                required>

            <div class="flex justify-between py-4">
                <div class="">
                    <input type="checkbox" name="remember" id="remember">
                    <label for="checkbox">Remember Me</label>
                </div>

                <a class="text-blue-800 hover:text-red-500 duration-150" href="#">Forgot Password?</a>
            </div>


            <button
                class="bg-blue-800 text-white text-xl py-1.5 rounded-xl shadow cursor-pointer hover:bg-blue-500 duration-200"><i
                    class="fa-solid fa-right-to-bracket"></i> Login</button>
        </form>

    </div>

</body>

</html>
